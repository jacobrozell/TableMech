name: TableMech
attributes:
  ORGANIZATIONNAME: Jacob Rozell
options:
  minimumXcodeGenVersion: 2.44.0
  developmentLanguage: en
  bundleIdPrefix: com.jacobrozell
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "7JT2JB89AV"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete

configs:
  Debug: debug
  Release: release

targets:
  TableMech:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Features
        excludes:
          - "**/README.md"
      - path: DesignSystem
        excludes:
          - "**/README.md"
      - path: Support
        excludes:
          - "**/README.md"
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/Content
        buildPhase: resources
        type: folder
    dependencies:
      - target: TableMechDomain
      - target: TableMechData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobrozell.tablemech
        PRODUCT_NAME: TableMech
        INFOPLIST_KEY_CFBundleDisplayName: TableMech
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: SwiftLint
        script: |
          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint --config "${SRCROOT}/.swiftlint.yml" || true
          fi
        basedOnDependencyAnalysis: false

  TableMechDomain:
    type: framework
    platform: iOS
    sources:
      - path: Domain
        excludes:
          - "**/README.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobrozell.tablemech.domain
        GENERATE_INFOPLIST_FILE: YES

  TableMechData:
    type: framework
    platform: iOS
    sources:
      - path: Data
        excludes:
          - "**/README.md"
      - path: Persistence
        excludes:
          - "**/README.md"
    dependencies:
      - target: TableMechDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobrozell.tablemech.data
        GENERATE_INFOPLIST_FILE: YES

  TableMechTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unit
      - path: Resources/Content
        buildPhase: resources
        type: folder
    dependencies:
      - target: TableMechDomain
      - target: TableMechData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobrozell.tablemech.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TableMech:
    build:
      targets:
        TableMech: all
        TableMechTests: [test]
    test:
      targets:
        - TableMechTests
    run:
      config: Debug

  TableMechCI:
    build:
      targets:
        TableMech: all
        TableMechTests: [test]
    test:
      targets:
        - TableMechTests
      config: Debug
    run:
      config: Debug
